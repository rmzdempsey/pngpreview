      <stop offset="0" stop-color="#2f83bd"/>
      <stop offset="1" stop-color="#173d67"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f56"/>
      <stop offset="1" stop-color="#061c3d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
